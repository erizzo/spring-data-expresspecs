# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Build and Test

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: write  ## Needed for the dependency graph upload step below
    strategy:
      fail-fast: false
      matrix:
        profile: [sb4, sb3]

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven (${{ matrix.profile }})
      run: ./mvnw -B --no-transfer-progress package -P${{ matrix.profile }}

  # Testcontainers against PostgreSQL, MySQL, MariaDB, and SQL Server (Docker on the runner).
  # Split from the main build matrix so PRs still get fast sb3/sb4 package checks without
  # blocking on container startup; Oracle stays in test-oracle below.
  test-tc:
    name: Test against real DBs (Docker-based)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Run Testcontainers tests (PostgreSQL, MySQL, MariaDB, SQL Server)
      run: ./mvnw -B --no-transfer-progress clean test -Psb4,tc

  # Oracle tests run as a separate job because they require Docker image caching
  # (the Oracle Free image is ~2 GB) and a container startup time of 60–90 seconds.
  # Keeping them separate avoids slowing down the main build matrix and isolates
  # the cache configuration from the standard Maven build steps.
  test-oracle:
    name: Tests against Oracle (Docker-based)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Restore Oracle Docker image cache
      id: cache-oracle
      uses: actions/cache@v4
      with:
        path: /tmp/oracle-image.tar
        key: oracle-free-23-slim-faststart

    - name: Load or pull Oracle Docker image
      run: |
        if [ "${{ steps.cache-oracle.outputs.cache-hit }}" == "true" ]; then
          docker load < /tmp/oracle-image.tar
        else
          docker pull gvenzl/oracle-free:23-slim-faststart
          docker save gvenzl/oracle-free:23-slim-faststart -o /tmp/oracle-image.tar
        fi

    - name: Run Oracle tests
      run: ./mvnw -B --no-transfer-progress clean test -Psb4,tc,oracle -Dtest=OracleSpecificationTests

  # Generates a JaCoCo coverage badge and publishes it to GitHub Pages.
  # Only runs on pushes to main so PRs don't overwrite the badge.
  coverage:
    name: Coverage badge
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: temurin
        cache: maven

    - name: Generate coverage report
      run: ./mvnw -B --no-transfer-progress verify -Psb4

    - name: Generate coverage badge
      uses: cicirello/jacoco-badge-generator@v2
      with:
        jacoco-csv-file: target/site/jacoco/jacoco.csv
        badges-directory: badges
        generate-coverage-badge: true

    - name: Stage files for GitHub Pages
      run: |
        mkdir -p gh-pages/badges
        mkdir -p gh-pages/coverage
        cp badges/jacoco.svg gh-pages/badges/jacoco.svg
        cp -r target/site/jacoco/. gh-pages/coverage/

    - name: Publish to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: gh-pages
